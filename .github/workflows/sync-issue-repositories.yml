name: Sync LifeTech issue repositories

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh repository dropdown
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update-repository-dropdown.py
      - name: Commit updated issue form
        run: |
          if git diff --quiet -- .github/ISSUE_TEMPLATE/package-issue.yml; then
            echo "Repository dropdown already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ISSUE_TEMPLATE/package-issue.yml
          git commit -m "chore: sync issue form repository options"
          git push
