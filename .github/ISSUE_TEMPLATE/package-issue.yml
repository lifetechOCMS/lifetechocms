
name: LifeTech OCMS Package Issue
description: Report issues affecting LifeTech OCMS core, themes, modules or plugins
title: "[PackageName] "
labels:
  - "status:needs-triage"

body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve LifeTechOCMS.
        Please provide the details below.

  - type: dropdown
    id: package-type
    attributes:
      label: Package Type
      description: Select the affected package category.
      options:
        - Core
        - Theme
        - Module
        - Plugin
    validations:
      required: true

  - type: input
    id: package-name
    attributes:
      label: Package Name e.g. ThemeLifeTech, MdBlog
      value: "LifetechOCMS"
    validations:
      required: true

  - type: dropdown
    id: repository-url
    attributes:
      label: Affected Repository
      description: Select the repository associated with this issue.
      options:
        - "lifetechOCMS/lifetechocms"
        - "adedayoAdetunji/md_forum"
        - "adedayoAdetunji/MdBlog"
        - "adedayoAdetunji/mdLtLogin"
        - "ajayi-abolore/pgsql_lifetechocms"
        - "ajayi-abolore/PlgMyFontAwesome"
        - "ajayi-abolore/PlgMyQuill"
        - "ajayi-abolore/PlgMySweetalert"
        - "ajayi-abolore/PlgMyTailwind"
        - "Classicking120/MdClassicComplaint"
        - "JohnPaulAchur/ThemeStory"
        - "lifetechOCMS/docs"
        - "lifetechOCMS/events"
        - "lifetechOCMS/MdLt"
        - "lifetechOCMS/modules"
        - "lifetechOCMS/ThemeLifeTech"
        - "oreyconceptz/ThemeWaitlist"
        - "Other / Not listed"
    validations:
      required: true

  - type: input
    id: other-repository-url
    attributes:
      label: Other Repository URL (only if not listed)
      description: Complete this only when you select Other / Not listed above.
      placeholder: https://github.com/owner/repository

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: Describe the issue clearly.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Install the package
        2. Open the affected page
        3. Observe the error

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What should happen instead?

  - type: textarea
    id: logs
    attributes:
      label: Error Logs or Screenshots
      description: Do not include passwords, tokens or other secrets.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have checked for existing issues.
          required: true
