services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME}_app
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      LT_DB_HOST: ${LT_DB_HOST}
      LT_DB_PORT: 3306
      LT_DB_NAME: ${LT_DB_NAME}
      LT_DB_USER: ${LT_DB_USER}
      LT_DB_PASS: ${LT_DB_PASS}
      LT_APP_ENV: development
      LT_RUNTIME: docker
      TZ: Europe/London
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: ${APP_NAME}_db
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Europe/London
    volumes:
      - db_data:/var/lib/mysql
      - ./includes/lifetech_installation_db.sql:/docker-entrypoint-initdb.d/01-lifetech_installation_db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 10
      interval: 10s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ${APP_NAME}_phpmyadmin
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PHPMYADMIN_PORT}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: 64M
      TZ: Europe/London
    restart: unless-stopped

volumes:
  db_data: