<script>


    // State variables
    let cardSection = [];
    let cardLayout = [];
    let search = '';
    let entriesPerPage = 10;
    let page = 1;
    let editId = null;
    let showFilters = false;

    
    
    const elements = {
        packageNameInput: document.getElementById("packageNameInput"),
        contentNameInput: document.getElementById("contentNameInput"),
        isEnabled: document.getElementById('isEnabled'),
        cardSectionSelect: document.getElementById('cardSectionSelect'),
        usageInput: document.getElementById('usageInput'),
        drawer: document.getElementById('sectionDrawer'),
        title: document.getElementById('drawerTitle'),
        submitBtn: document.getElementById('submitBtn'),
        enableStatusDisplay: document.getElementById("enableStatusDisplay"),
        tableInfo: document.getElementById('tableInfo'),
        paginationNav: document.getElementById('paginationNav'),
        filterBar: document.getElementById('filterBar'),
        tableBody: document.getElementById('tableBody'),
    }
    

    

    // Filter data based on search
    function filterData() {
      return cardLayout.filter(c => {
        return (
            !search 
            || c.packageName.toLowerCase().includes(search.toLowerCase())
            || c.contentName.toLowerCase().includes(search.toLowerCase())
            );
      });
    }
    
    function populateSection(value){
        let html = '<option value="">-- Select Section --</option>';
        
         html += cardSection.map(s => `<option value="${s.ltId}" ${s.ltId === value ? 'selected' : ''}> ${s.name} </option>`).join('');
        return html;
    }
    
    function getSectionName(sectionId){
        let section = cardSection.find(s => +s.ltId === +sectionId);
        return section.name;
    }
    

    // Paginate data
    function paginateData(data) {
      const start = (page - 1) * entriesPerPage;
      const end = start + entriesPerPage;
      return data.slice(start, end);
    }

    // Update table with current data
    function updateTable() {
      const filtered = filterData();
      const paginated = paginateData(filtered);
      const total = filtered.length;
      const totalPages = Math.max(1, Math.ceil(total / entriesPerPage));

      // Update table body
      elements.tableBody.innerHTML = '';
      if (paginated.length === 0) {
        elements.tableBody.innerHTML = '<tr><td colspan="8" class="text-center py-6 text-gray-400">No Card Layout Found.</td></tr>';
      } else {
        paginated.forEach((s, i) => {
          const tr = document.createElement('tr');
          tr.className = `hover:bg-blue-50 transition duration-150 cursor-pointer`;
          tr.innerHTML = `
            <td class="py-3 px-4 border-b border-gray-200 text-center">${(page - 1) * entriesPerPage + i + 1}</td>
            <td class="py-3 px-4 border-b border-gray-200">
            <div class="flex items-center gap-1">
                <div class="font-medium text-blue-700" data-id="${s.ltId}" id="viewAvailableProfile">${s.packageName}</div>
                <span id="viewLoader"></span>
            </div>
            </td>
            <td class="py-3 px-4 border-b border-gray-200">${s.contentName}</td>
            <td class="py-3 px-4 border-b border-gray-200">
            <select class="w-full rounded-md border border-gray-200 px-3 py-2 focus:border-blue-200 focus:ring-blue-200" id="cardSectionSelectUpdate" data-id="${s.ltId}">
                ${populateSection(s.cardSectionId)}
            </select>
            </td>
            <td class="py-3 px-4 border-b border-gray-200"><textarea readonly>${s.userGuide}</textarea></td>

            <td class="py-3 px-4 border-b border-gray-200">
              <span id="isEnabledStatus" data-id="${s.ltId}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${s.isEnabled == '1' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">
                <span class="w-2 h-2 ${s.isEnabled == '1' ? 'bg-green-500' : 'bg-yellow-500'} rounded-full mr-1.5"></span>
                ${s.isEnabled == '1' ? 'Enabled' : 'Disabled'}
              </span>
            </td>
            <td class="py-3 px-4 border-b border-gray-200">
              <div class="flex justify-center">
                <button aria-label="Edit" class="text-gray-500 hover:text-blue-600 mx-1 focus:outline-none" data-id="${s.ltId}">
                  <i class="fas fa-edit text-xl text-green-500"></i>
                </button>
                <button aria-label="Delete" class="text-gray-500 hover:text-red-600 mx-1 focus:outline-none" data-id="${s.ltId}">
                  <i class="fas fa-trash-alt text-xl text-red-400"></i>
                </button>
              </div>
            </td>
          `;
          elements.tableBody.appendChild(tr);
        });
      }

      // Update pagination
      updatePagination(total, totalPages);

      // Update table info
      const start = total === 0 ? 0 : (page - 1) * entriesPerPage + 1;
      const end = Math.min(page * entriesPerPage, total);
      elements.tableInfo.textContent = `Showing ${start} to ${end} of ${total} entries`;

      // Add event listeners to table elements
      addTableEventListeners();
    }

function updatePagination(total, totalPages) {
  elements.paginationNav.innerHTML = `
    <button class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 disabled:opacity-50" id="prevPageBtn" ${page === 1 ? 'disabled' : ''}>
      <i class="fas fa-chevron-left text-xs"></i>
    </button>
  `;

  const maxButtons = 5;
  let startPage, endPage;

  if (totalPages <= maxButtons) {
    startPage = 1;
    endPage = totalPages;
  } else if (page <= 3) {
    startPage = 1;
    endPage = 5;
  } else if (page >= totalPages - 2) {
    startPage = totalPages - 4;
    endPage = totalPages;
  } else {
    startPage = page - 2;
    endPage = page + 2;
  }

  for (let i = startPage; i <= endPage; i++) {
    const btn = document.createElement('button');
    btn.className = `relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium ${page === i ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'}`;
    btn.textContent = i;
    btn.disabled = page === i;
    btn.addEventListener('click', () => {
      page = i;
      updateTable();
    });
    elements.paginationNav.appendChild(btn);
  }

  const nextBtn = document.createElement('button');
  nextBtn.className = `relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 disabled:opacity-50`;
  nextBtn.id = 'nextPageBtn';
  nextBtn.innerHTML = '<i class="fas fa-chevron-right text-xs"></i>';
  nextBtn.disabled = page === totalPages;
  nextBtn.addEventListener('click', () => {
    if (page < totalPages) {
      page++;
      updateTable();
    }
  });
  elements.paginationNav.appendChild(nextBtn);

  document.getElementById('prevPageBtn').addEventListener('click', () => {
    if (page > 1) {
      page--;
      updateTable();
    }
  });
}

    // Add event listeners to table elements
    function addTableEventListeners() {
      // Select all checkbox

      // Sort buttons
      document.querySelectorAll('[data-sort]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const sortKey = e.currentTarget.getAttribute('data-sort');
          handleSort(sortKey);
        });
      });
      
      // Edit buttons
      document.querySelectorAll('button[aria-label="Edit"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const ltId = e.currentTarget.getAttribute('data-id');
          handleEdit(ltId);
        });
      });

      // Delete buttons
      document.querySelectorAll('button[aria-label="Delete"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const ltId = e.currentTarget.getAttribute('data-id');
          deleteLayout(ltId);
        });
      });
      
      
    }

    function handleisEnabled(ltId){
        
        cardLayout = cardLayout.map(profile => profile.ltId === +ltId ? {...profile, isEnabled: profile.isEnabled ? 0 : 1} : profile);
        updateTable();
    }

    async function handleDelete(ltId) {
        cardLayout = cardLayout.filter(s => +s.ltId !== +ltId);
        updateTable();
   
    }
    
    
    

    // package drawer functions
    function openProfileDrawer() {
      const modalLabel = document.getElementById('modalLabel');
 
    // 1. Find the Layout
      const Layout = cardLayout.find(p => p.ltId == editId);
        // update the title 
      modalLabel.innerHTML = editId ? `<i class="fas fa-edit mr-2"></i>Edit Layout` : ` <i class="fas fa-plus mr-2"></i> New Layout`; 
      
      if(!editId){
          document.getElementById('enableStatusDisplay').classList.remove('hidden');
      }
         
      elements.drawer.classList.remove('hidden');
    };

    function closeProfileDrawer() {
      elements.drawer.classList.add('hidden');
      document.getElementById('modalLabel').innerHTML = '';
      document.getElementById('layoutForm').reset();
      editId = null;
    };
    

    async function handleFormSubmit(e) {
      e.preventDefault();
      
      let formData = new FormData(document.getElementById('layoutForm'));
        if (editId) {
            formData.delete('isEnabled');
            const formEdit = Object.fromEntries(formData.entries());

          // Update Package
            Swal.fire({
                title: 'Notice!',
                text: 'Are you sure you want to update this Layout?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Yes, Update',
                cancelButtonText: 'No, Cancel'
            }).then(async result => {
                if (result.isConfirmed) {
                    
                        elements.submitBtn.innerHTML = '<span class="animate-pulse">processing...</span>';
                    try{
                        
                        const response = await fetch(`${BASE_URL}/cards/contents/layouts/${editId}`, {
                            method: 'PATCH',
                            headers: {
                                'Authorization': `Bearer ${LW_TOKEN}`,
                                'Accept': 'application/json'
    
                            },
                            body: JSON.stringify(formEdit)
                        });
                        
                        const result = await response.json();
                        const {responseData, responseCategory, responseResult} = result;
 
                        if(responseCategory == 200){
                              // update the table
                            cardLayout = cardLayout.map(s => s.ltId === +editId ? {
                                ...s,
                                ...responseData
                              } : s);
                
                            Swal.fire('Notice!!!', 'Updated Successfully', 'success').then(function(){
                                elements.submitBtn.textContent = 'Update';
                                    updateTable();
                                 closeProfileDrawer();
                            });
                        }else{
                            Swal.fire('Error!!!', `${responseResult}`, 'warning').then(function(){
                                elements.submitBtn.textContent = 'Update';
                             
                            })
                            
                        }
    
                    }catch(error){
                        Swal.fire('Error!!!', `${error}`, 'warning');
                         elements.submitBtn.innerHTML = 'Update';
                      
                    }
                }
            });

        } else {
          
            Swal.fire({
                title: 'Notice!',
                text: 'Are you sure you want to add this Layout?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Yes, Add',
                cancelButtonText: 'No, Cancel'
            }).then(async result => {
                if (result.isConfirmed) {
                    
                    try {
                        elements.submitBtn.innerHTML = '<span class="animate-pulse">processing...</span>';
                        // 4. The Direct Fetch Call
                        const response = await fetch(`${BASE_URL}/cards/contents/layouts`, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${LW_TOKEN}`,
                                'Accept': 'application/json'
    
                            },
                            // body: JSON.stringify(formEdit)
                            body: formData
                        });
                    
                        // 5. Parse the JSON response
                        const result = await response.json();
                         const {responseData, responseCategory, responseResult} = result;
                    
                        if(responseCategory == 200){
                            cardLayout = [...cardLayout, responseData];

                            Swal.fire('Notice!!!', 'Card Layout Added successfully', 'success').then(function(){
                                 elements.submitBtn.innerHTML = 'Submit';
                                    closeProfileDrawer();
                                    updateTable();
                            });
    
                        }else{
                            Swal.fire('Error!!!', `${responseResult}`, 'warning').then(function(){
                                elements.submitBtn.innerHTML = 'Submit';
                            })
                        }
                    
                    } catch (error) {
                        // 7. Handle Network Errors (e.g., DNS issues, offline)
                        console.error('Network Error:', error);
                        Swal.fire('Error', 'Network error occurred', 'error');
                    }
            
                }
            }); 

        }
        

    }

  function handleEdit(ltId) {
       
       
    const modalLabel = document.getElementById('modalLabel');
    document.getElementById('enableStatusDisplay').classList.add('hidden');
       
       
    // 1. Find the Layout
    const Layout = cardLayout.find(p => p.ltId == ltId);

    if (!Layout) return;
      // storing the ID somewhere for Updating
    editId = ltId;
    
     
    // update the title 
    modalLabel.innerHTML = `<i class="fas fa-edit mr-2"></i>Edit Layout`;

    const form = document.getElementById('layoutForm');

    // ---------------------------------------------------------
    // A. Standard Fields (Text, Email, Select, Textarea)
    // ---------------------------------------------------------
    const fields = [
        'packageName', 'contentName', 'userGuide',
    ];

    fields.forEach(field => {
        const input = form.querySelector(`[name="${field}"]`);
        // Check if input exists and Layout has data for it
        if (input && Layout[field] !== undefined && Layout[field] !== null) {
            
            input.value = Layout[field];
        } else if (input) {
            input.value = ''; // Clear if data is null
        }
        
    });
    
    let html = populateSection(Layout['cardSectionId']);
    elements.cardSectionSelect.innerHTML = html;
    
    // D. Open the Drawer / Modal
    openProfileDrawer();
    
 
}



    
    //// Delete event Listener
     function deleteLayout(ltId){
        let res = cardLayout.find(s => s.ltId == ltId);

        Swal.fire({
            title: 'Notice!',
            text: `Are you sure you want to delete this card Layout?`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Yes, Delete',
            cancelButtonText: 'No, Cancel'
        }).then(async result => {
            if (result.isConfirmed) {
   
                try{
                    
                    const data = await ajaxRequest(`/cards/contents/layouts/${ltId}`,'', 'DELETE');
                    
                    const {responseData, responseResult, responseCategory} = data;
                    if(responseCategory == '200'){
                        let msg = `Card Layout Deleted successfully ✌️`;
                        Swal.fire('Notice!!!',msg,'success').then(function(){
                            handleDelete(ltId);
                        });
                         
                    }else{
                        Swal.fire('Error!!!', `${responseResult}`, 'warning');
                    }
                    
                }catch(error){
                    Swal.fire('Error!!!', `${error}`, 'warning');
                }
            }
        }); 
    
    };
    

    // Initialize event listeners
    function initEventListeners() {
    
    document.addEventListener('click', function(e){
        let btn = e.target.closest('#cardSectionSelectUpdate');
        let sectionId = btn?.value;
        if(!sectionId) return;
        let ltId = btn.dataset.id;
        let res = cardLayout.find(s => s.ltId == ltId);
        if(res.cardSectionId === +sectionId) return;

        Swal.fire({
            title: 'Notice!',
            text: `Are you sure you want to assign section ${getSectionName(sectionId)} to this profile?`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: `Yes, assign`,
            cancelButtonText: 'No, Cancel'
        }).then(async result => {
            if (result.isConfirmed) {
                try{

                    const data = await ajaxRequest(`/cards/contents/layouts/${ltId}/assign-section/${sectionId}`, '', 'PATCH');

                    if(responseCategory == '200'){
