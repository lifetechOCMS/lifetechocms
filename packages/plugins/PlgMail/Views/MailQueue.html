<script>


    // State variables
    let queues  = [];
    let search = '';
    let entriesPerPage = 10;
    let page = 1;
    let sort = { key: '', dir: 'asc' };
    let editId = null;
    let showFilters = false;
    let selected = [];
    const loaderClass = "w-5 h-5 rounded-full border-4 border-blue-600 border-t-transparent animate-spin";
    
    const elements = {
        deselectAllBtn: document.getElementById("deselectAllBtn"),
        codeInput: document.getElementById("codeInput"),
        emailInput: document.getElementById("emailInput"),
        phoneInput: document.getElementById("phoneInput"),
        addressInput: document.getElementById("addressInput"),
        isActive: document.getElementById('isActive'),
        drawer: document.getElementById('sectionDrawer'),
        title: document.getElementById('drawerTitle'),
        submitBtn: document.getElementById('submitBtn'),
        selectionActions: document.getElementById('selectionActions'),
        selectedCount: document.getElementById('selectedCount'),
        selectedMailSendBtn: document.getElementById('selectedMailSendBtn'),
        tableInfo: document.getElementById('tableInfo'),
        paginationNav: document.getElementById('paginationNav'),
        filterBar: document.getElementById('filterBar'),
        tableBody: document.getElementById('tableBody'),
    }
    

    

    // Filter data based on search
    function filterData() {
      return queues.filter(p => {
        return (
            !search 
            || p.toName.toLowerCase().includes(search.toLowerCase())
            || p.toEmail.toLowerCase().includes(search.toLowerCase())
            );
      });
    }


    // Paginate data
    function paginateData(data) {
      const start = (page - 1) * entriesPerPage;
      const end = start + entriesPerPage;
      return data.slice(start, end);
    }

    // Update table with current data
    function updateTable() {
      const filtered = filterData();
      const paginated = paginateData(filtered);
      const total = filtered.length;
      const totalPages = Math.max(1, Math.ceil(total / entriesPerPage));

      // Update table body
      elements.tableBody.innerHTML = '';
      if (paginated.length === 0) {
        elements.tableBody.innerHTML = '<tr><td colspan="8" class="text-center py-6 text-gray-400">No Queue Found.</td></tr>';
      } else {
        paginated.forEach((s, i) => {
          const tr = document.createElement('tr');
          tr.className = `hover:bg-blue-50 transition duration-150 cursor-pointer`;
          tr.innerHTML = `
            <td class="py-3 px-4 border-b border-gray-200 text-center">
              <input type="checkbox" class="row-checkbox" data-id="${s.ltId}" ${selected.includes(s.ltId) ? 'checked' : ''} />
            </td>
            <td class="py-3 px-4 border-b border-gray-200 text-center">${(page - 1) * entriesPerPage + i + 1}</td>
            <td class="py-3 px-4 border-b border-gray-200">
            <div class="flex items-center gap-1">
                <div class="font-medium text-blue-700">${s.toEmail}</div>
            </div>
            </td>
            <td class="py-3 px-4 border-b border-gray-200">${s.toName}</td>
            <td class="py-3 px-4 border-b border-gray-200">${s.subject}</td>
            <td class="py-3 px-4 border-b border-gray-200 truncate">${s.bodyText}</td>
            <td class="py-3 px-4 border-b border-gray-200">${s.sentAt}</td>
            <td class="py-3 px-4 border-b border-gray-200">
              <span id="isActiveStatus" data-id="${s.ltId}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${s.status == 'sent' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                <span class="w-2 h-2 ${s.status == 'sent' ? 'bg-green-500' : 'bg-red-500'} rounded-full mr-1.5"></span>
                ${s.status == 'sent' ? 'Sent' : 'Pending'}
              </span>
            </td>
            <td class="py-3 px-4 border-b border-gray-200">
              <div class="flex justify-center">
                <div class="flex items-center gap-1">
                    <span id="viewLoader"></span>
                    <button aria-label="Send Mail" class="send-mail-btn text-gray-500 hover:text-blue-600 mx-1 focus:outline-none" data-id="${s.ltId}">
                      <i class="fas fa-paper-plane text-xl text-green-500"></i> Send
                    </button>
                </div>
                <button aria-label="Edit" class="text-gray-500 hover:text-blue-600 mx-1 focus:outline-none" data-id="${s.ltId}">
                  <i class="fas fa-edit text-xl text-green-500"></i>
                </button>
                <button aria-label="Delete" class="text-gray-500 hover:text-red-600 mx-1 focus:outline-none" data-id="${s.ltId}">
                  <i class="fas fa-trash-alt text-xl text-red-400"></i>
                </button>
              </div>
            </td>
          `;
          elements.tableBody.appendChild(tr);
        });
      }

      // Update pagination
      updatePagination(total, totalPages);

      // Update table info
      const start = total === 0 ? 0 : (page - 1) * entriesPerPage + 1;
      const end = Math.min(page * entriesPerPage, total);
      elements.tableInfo.textContent = `Showing ${start} to ${end} of ${total} entries`;
    
     // Update selection UI
      updateSelectionUI();    
        
      // Add event listeners to table elements
      addTableEventListeners();
    }

function updatePagination(total, totalPages) {
  elements.paginationNav.innerHTML = `
    <button class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 Inactive:opacity-50" id="prevPageBtn" ${page === 1 ? 'Inactive' : ''}>
      <i class="fas fa-chevron-left text-xs"></i>
    </button>
  `;

  const maxButtons = 5;
  let startPage, endPage;

  if (totalPages <= maxButtons) {
    startPage = 1;
    endPage = totalPages;
  } else if (page <= 3) {
    startPage = 1;
    endPage = 5;
  } else if (page >= totalPages - 2) {
    startPage = totalPages - 4;
    endPage = totalPages;
  } else {
    startPage = page - 2;
    endPage = page + 2;
  }

  for (let i = startPage; i <= endPage; i++) {
    const btn = document.createElement('button');
    btn.className = `relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium ${page === i ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'}`;
    btn.textContent = i;
    btn.Inactive = page === i;
    btn.addEventListener('click', () => {
      page = i;
      updateTable();
    });
    elements.paginationNav.appendChild(btn);
  }

  const nextBtn = document.createElement('button');
  nextBtn.className = `relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 Inactive:opacity-50`;
  nextBtn.id = 'nextPageBtn';
  nextBtn.innerHTML = '<i class="fas fa-chevron-right text-xs"></i>';
  nextBtn.Inactive = page === totalPages;
  nextBtn.addEventListener('click', () => {
    if (page < totalPages) {
      page++;
      updateTable();
    }
  });
  elements.paginationNav.appendChild(nextBtn);

  document.getElementById('prevPageBtn').addEventListener('click', () => {
    if (page > 1) {
      page--;
      updateTable();
    }
  });
}
    
    function deselectAll(){
        const filtered = filterData();
      const paginated = paginateData(filtered);
      const paginatedIds = paginated.map(p => p.ltId);
        selected = selected.filter(id => !paginatedIds.includes(id));
       updateTable();
    }
    
    
    function handleSelectRow(id, checked) {
        
      if (checked) {
        if (!selected.includes(id)) selected.push(id);
      } else {
        selected = selected.filter(sid => sid !== id);
      }
      updateSelectionUI();
      

    }
    
    function handleSelectAll(checked) {
      const filtered = filterData();
      const paginated = paginateData(filtered);
      if (checked) {
        const newSelected = [...new Set([...selected, ...paginated.map(p => p.ltId)])];
        selected = newSelected;
      } else {
        const paginatedIds = paginated.map(p => p.ltId);
        selected = selected.filter(id => !paginatedIds.includes(id));
      }
       updateTable();
    }
    
    
    function updateSelectionUI() {
      const filtered = filterData();
      const paginated = paginateData(filtered);
      const allSelected = paginated.length > 0 && paginated.every(m => selected.includes(m.ltId));
      
      // Update select all checkbox
      document.getElementById('selectAllCheckbox').checked = allSelected;
      
      // Update selection actions
      if (selected.length > 0) {
        elements.selectionActions.classList.remove('hidden');
        elements.selectedCount.textContent = `${selected.length} item${selected.length === 1 ? '' : 's'} selected`;
        
        elements.selectedMailSendBtn.classList.toggle('hidden', selected.length < 1);
      } else {
        elements.selectionActions.classList.add('hidden');
      }
    }



    async function sendMail(mailId, btn) {
          let btnLoader = btn.previousElementSibling;
         
          btnLoader.innerHTML= '<div class="w-5 h-5 rounded-full border-4 border-blue-600 border-t-transparent animate-spin"></div>';
          
          try {
            const response = await fetch(`${BASE_URL}/queues/send-mail`, {
              method: "POST",
              headers: {
                  "Accept": "application/json",
                  "Authorization": `Bearer ${LW_TOKEN}`,
              },
              body: JSON.stringify({mailId})
            });
            
            if (!response.ok) {
                throw new Error("failed to sent.");
              }
            const res = await response.json();
            const {responseCategory} = res;
            
            if(responseCategory == 200){
                let msg = "Email sent successfully";
                // queues  = queues.map(q => q.ltId == mailId ? {...queues, status: 'sent'} : q);
                Swal.fire('Notice!!!',msg,'success').then(function(){
                    updateTable();
                });
            }else{
                throw new Error("Send failed.:");
            }
    
        } catch (error) {
            console.error(error);
        
            Swal.fire(
              "Notice!!!",
              error.message || "Unable to send mail.",
              "warning"
            );
        }finally{
             btnLoader.innerHTML = "";
        }
    }
    
    
    async function sendMultipleMail(selectedMail, btn) {
          let selectedIds = selectedMail;
          let btnLoader = btn.previousElementSibling;
         
          btnLoader.innerHTML= '<div class="w-5 h-5 rounded-full border-4 border-blue-600 border-t-transparent animate-spin"></div>';
          
          try {
            const response = await fetch(`${BASE_URL}/queues/send-multiple-mail`, {
              method: "POST",
              headers: {
                  "Accept": "application/json",
                  "Authorization": `Bearer ${LW_TOKEN}`,
              },
              body: JSON.stringify({selectedIds})
            });
            
            if (!response.ok) {
                throw new Error("failed to sent.");
              }
            const res = await response.json();
            const {responseData, responseResult, responseCategory} = res;
            
            if(responseCategory == 200){
                let msg = "Email sent successfully";
                // queues  = queues.map(q => q.) [...queues, ...responseData];
                Swal.fire('Notice!!!',msg,'success').then(function(){
                    updateTable();
                });
            }else{
                throw new Error("Send failed.:", responseResult);
            }
    
        } catch (error) {
            console.error(error);
        
            Swal.fire(
              "Notice!!!",
              error.message || "Unable to send mail.",
              "warning"
            );
        }finally{
             btnLoader.innerHTML = "";
        }
    }

    
     document.getElementById('selectedMailSendBtn').addEventListener('click', function(e){
        e.stopPropagation();
        if(selected.length < 1) return;
        let btn = e.currentTarget;
        let selectedChecked = selected;
        sendMultipleMail(selectedChecked, btn);

    })
    

    // Add event listeners to table elements
    function addTableEventListeners() {
        
        document.querySelectorAll(".send-mail-btn").forEach((button) => {
            button.addEventListener("click", (e) => {
              e.stopPropagation();
            
              if(!button)return;
              const mailId = button.dataset.id;
              sendMail(mailId, button);
              
            });
        });
        
        
      // Select all checkbox
         // Row checkboxes
      document.querySelectorAll('.row-checkbox[data-id]').forEach(checkbox => {
        checkbox.addEventListener('change', (e) => {
          const id = e.target.getAttribute('data-id');
          handleSelectRow(id, e.target.checked);
        });
      });
      // Sort buttons
      document.querySelectorAll('[data-sort]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const sortKey = e.currentTarget.getAttribute('data-sort');
          handleSort(sortKey);
        });
      });
      
      // Edit buttons
      document.querySelectorAll('button[aria-label="Edit"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const ltId = e.currentTarget.getAttribute('data-id');
          handleEdit(ltId);
        });
      });

      // Delete buttons
      document.querySelectorAll('button[aria-label="Delete"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const ltId = e.currentTarget.getAttribute('data-id');
          deleteMail(ltId);
        });
      });
      
      
    }

    async function handleDelete(ltId) {
        queues  = queues.filter(s => s.ltId !== ltId);
        updateTable();
   
    }

          modalLabel.innerHTML = editId ? `<i class="fas fa-edit mr-2"></i>Edit <span class="mx-1 text-amber-400"> ${queue?.queueName} </span> Section` : ` <i class="fas fa-plus mr-2"></i> New School`;

        function closeProfileDrawer() {
          elements.drawer.classList.add('hidden');
          document.getElementById('modalLabel').innerHTML = '';
          document.getElementById('queueForm').reset();

       function handleEdit(ltId) {
           
           
        const modalLabel = document.getElementById('modalLabel');
    
        // 1. Find the School
        const queue  = queues.find(p => p.ltId == ltId);
        if (!queue ) return;
           // storing the ID somewhere for Updating
        editId = ltId;
        
         
        // update the title 
        modalLabel.innerHTML = `<i class="fas fa-edit mr-2"></i>Edit <span class="mx-1 text-amber-400"> ${queue?.title} </span> queue `;
    
        const form = document.getElementById('queueForm');
    
        // ---------------------------------------------------------
        // A. Standard Fields (Text, Email, Select, Textarea)
        // ---------------------------------------------------------
        const fields = [
            'queueName', 'queueCode', 'queueEmail', 'queuePhone', 'queueAddress'
        ];
    
        fields.forEach(field => {
            const input = form.querySelector(`[name="${field}"]`);
            // Check if input exists and queue  has data for it
            if (input && queue[field] !== undefined && queue[field] !== null) {
                input.value = queue[field];
            } else if (input) {
                input.value = ''; // Clear if data is null
            }
        });
    
        // D. Open the Drawer / Modal
        openProfileDrawer();
        
     
    }

            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Yes, Delete',

        }).then(async result => {
            if (result.isConfirmed) {
   
                try{

                    const {responseData, responseResult, responseCategory} = data;

                        Swal.fire('Notice!!!',msg,'success').then(function(){
                            handleDelete(ltId);
                        });
                         
                    }else{
                        Swal.fire('Error!!!', `${responseResult}`, 'warning');
                    }
                    
                }catch(error){
                    Swal.fire('Error!!!', `${error}`, 'warning');
                }
            }
        }); 
    
    };

    function init() {
        
        async function onloadQueue(){
              
            fx_lifetech_button_loader_open();
            try{
                
                const response = await fetch(`${BASE_URL}/queues`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${LW_TOKEN}`,
                        'Accept': 'application/json'

                    }
                });
                
                
                
                if(!response.ok) throw new Error('failed to fetch');
                const queueData = await response.json();

                const { responseData, responseResult, responseCategory } = queueData;
                 
                 if(responseCategory == 200){

                      queues  = Array.isArray(responseData) ?  [...responseData] : [];
                     updateTable();
                 }else{
                     Swal.fire('Notice!!!', `${responseResult}`, 'warning')
                 }
                 
                 fx_lifetech_button_loader_close(); 
            }catch(error){
                 
                 console.log(error);
    
            }
             
         }
         
        onloadQueue();
