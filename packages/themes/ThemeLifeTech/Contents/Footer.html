<script>
    function init() {
        async function onloadMenuContent() {
            try {
                const [quickLinkRes, servicesRes] = await Promise.all([
                    fetch(`${BASE_URL}/menus/is-quicklink`, {
                        method: "GET",
                        headers: { 'Accept': 'application/json' }
                    }),
                    fetch(`${BASE_URL}/menus/is-service`, {
                        method: "GET",
                        headers: { 'Accept': 'application/json' }
                    })
                ]);

                const quickLinksData = await quickLinkRes.json();
                const servicesData = await servicesRes.json();

                // Helper function to build the HTML lists
                function renderLinks(elementId, apiData) {
                    const ul = document.getElementById(elementId);
                    if (!ul) return;

                    // Assuming your API returns data inside a 'responseResult' array 
                    // based on your previous backend setup. Adjust if it's just the raw array.
                    const items = apiData.responseData || apiData;
            
                    if (Array.isArray(items) && items.length > 0) {
                        ul.innerHTML = items.map(item => `
                            <li>
                                <a href="${siteHostAddress}${item.route_path || '#'}" class="text-gray-400 hover:text-primary transition-colors" target="${item.target}">
                                    ${item.menu_name}
                                </a>
                            </li>
                        `).join('');
                    } else {
                        ul.innerHTML = `<li><span class="text-gray-600">No links available</span></li>`;
                    }
                }

                // Render the data into the respective DOM elements
                renderLinks('quick-links-list', quickLinksData);
                renderLinks('services-list', servicesData);

            } catch (error) {
                console.error("Footer Menu Load Error:", error);
            }
        }

        onloadMenuContent();
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
