 <?php ltImport('mdLtTheme','LtThemeService.js') ?>
 <script>
  
  
    // State management
    const state = {
      form: {
        username: '',
        password: '',
      },
      loading: false,
      showPassword: false
    };

    // DOM elements
    const elements = {};
    
    let inputElements = ['signUpForm', 'username', 'email', 'firstname', 'surname', 'togglePassword', 'passwordInput', 'submitBtn', 'snackbar'
    ]
    
    for(const value of inputElements){
        elements[value] = document.getElementById(value);
    }
  
  elements.togglePassword.addEventListener('click', function(e){
      state.showPassword = !state.showPassword;
      let el = e.target;
       if (state.showPassword) {
        elements.passwordInput.type = 'text';
        el.classList.replace('fa-eye', 'fa-eye-slash');
        el.setAttribute('aria-label', `Hide Password`);
      } else {
        elements.passwordInput.type = 'password';
        el.classList.replace('fa-eye-slash', 'fa-eye');
        el.setAttribute('aria-label', `Show Password`);
      }

  })

    
    // Initialize the application
    function init() {
    //   // Add event listeners
      elements.signUpForm.addEventListener('submit', handleSubmit);
    }

    // Event handlers
    function handleInputChange(e) {
      const { name, value } = e.target;
      state.form[name] = value;
    }


    function showSnackbar(message, color = 'green') {
      elements.snackbar.textContent = message;
      elements.snackbar.className = `fixed top-6 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-lg shadow-lg text-white text-sm font-medium transition-all duration-300 flex items-center ${color === 'green' ? 'bg-green-600' : color === 'yellow' ? 'bg-yellow-600':'bg-red-600'}`;
      
      const icon = document.createElement('i');
      icon.className = `fas ${color === 'green' ? 'fa-check-circle' : 'fa-exclamation-circle'} mr-2`;
      elements.snackbar.prepend(icon);
      
      elements.snackbar.classList.remove('hidden');
      
      // Auto-hide after appropriate time
      const hideTime = color === 'green' ? 2000 : 3000;
      setTimeout(() => {
        elements.snackbar.classList.add('fade-out');
        setTimeout(() => {
          elements.snackbar.classList.add('hidden');
          elements.snackbar.classList.remove('fade-out');
        }, 300);
      }, hideTime);
    }

    async function handleSubmit(e) {
      e.preventDefault();
      
      let rawFormData = new FormData(elements.signUpForm);
      formData = Object.fromEntries(rawFormData.entries());
      
      if (!formData.username && !formData.email) {
              showSnackbar(`Email or Username field is required`, 'yellow');
              return;
        }
        
      if(!formData.password){
            showSnackbar(`Password must not be empty`, 'yellow');
            return;
        }
      
      // Set loading state
      state.loading = true;
      elements.submitBtn.disabled = true;
      elements.submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i><span class="animate-pulse">Processing...</span>';
      
  

      try {
          const options = {
            method: 'POST',
            headers: {
              'Accept': 'application/json'
            },
            body: JSON.stringify(formData)
          };
        
          const res = await fetch(`${BASE_URL}/usersb`, options);
          const data = await res.json();
          const { responseData, responseCategory, responseResult } = data;
        
          if (responseCategory === "200") {
                showSnackbar('Registration Successfully', 'green');
            
                setTimeout(() => {
                    window.location.href = `${siteHostAddress}/sign-in`;
                }, 1000);
          } else {
            showSnackbar(`failed: ${responseResult || 'Invalid credentials'}`, 'red');
          }
        } catch (err) {
          showSnackbar(`error: ${err.message || 'Something went wrong'}`, 'red');
        }

      
      // Reset loading state
      state.loading = false;
      elements.submitBtn.disabled = false;
      elements.submitBtn.textContent = 'Sign Up';
    }

    // Initialize the app when DOM is loaded
    document.addEventListener('DOMContentLoaded', init);
  </script>
