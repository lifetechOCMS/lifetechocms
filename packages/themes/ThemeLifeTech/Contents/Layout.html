<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeTech</title>
    <meta name="description" content="Discover all the powerful features of LifeTech CMS. Everything you need to build and manage your website.">

     <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#08cf72',
                        'primary-dark': '#06b85f',
                        'primary-light': '#0ee685',
                    }
                }
            }
        }
    </script>
    
    <style>
        /* ============================================
   LifeTech Custom Styles with Tailwind CSS
   Primary Color: #08cf72
   ============================================ */

/* 1. Set the body to a flex container that fills the whole screen */
body {
    min-height: 100vh;
    min-height: 100dvh; /* For mobile browser bars */
    margin: 0;
}

/* 2. Target the element that wraps llt::loadDynamicContent() */
main, .content-wrapper {
    flex: 1 0 auto; /* This '1' tells it to grow and take up empty space */
    /*display: flex;*/
    /*align-items: center; */
    /*justify-content: center;*/
}

/* 3. The footer stays at its natural size but is pushed down */
footer {
    flex-shrink: 0; /* Prevents the footer from squishing */
}   


/* Custom Button Styles */
.btn-primary {
    background-color: #08cf72;
    color: white;
    transition: all 0.3s ease;
}

.btn-primary:hover {
    background-color: #06b85f;
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(8, 207, 114, 0.3);
}

.btn-outline-light {
    color: white;
    border: 2px solid rgba(255, 255, 255, 0.3);
    transition: all 0.3s ease;
}

.btn-outline-light:hover {
    background-color: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.5);
}

.btn-outline-primary {
    border: 2px solid #08cf72;
    color: #08cf72;
    transition: all 0.3s ease;
}

.btn-outline-primary:hover {
    background-color: #08cf72;
    color: white;
    transform: translateY(-2px);
}

/* Section Title Underline */
.section-title {
    position: relative;
    display: inline-block;
}

.section-title::after {
    content: '';
    position: absolute;
    width: 60px;
    height: 4px;
    background: #08cf72;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 2px;
}

/* Carousel Slide Transitions */
.carousel-slide {
    transition: opacity 0.8s ease-in-out;
}

.carousel-slide.active {
    opacity: 1;
    z-index: 10;
}

.carousel-slide:not(.active) {
    opacity: 0;
    z-index: 1;
}

/* Carousel Indicator Active State */
.carousel-indicator.active {
    background-color: #08cf72;
    border-color: white;
    width: 12px;
    height: 12px;
}

/* Scroll Animations */
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.fade-in {
    animation: fadeInUp 0.8s ease;
    opacity: 1 !important;
}

/* Smooth scroll offset for fixed navbar */
section {
    scroll-margin-top: 80px;
}

/* Feature Card Hover Effects */
.feature-card:hover .feature-icon {
    transform: scale(1.1) rotate(5deg);
}

.service-card:hover .service-icon {
    transform: scale(1.1);
}

/* Forum Post Hover Border */
.forum-post:hover {
    border-left-color: #08cf72 !important;
}

/* Navbar Active Link */
.nav-link.active {
    color: #08cf72 !important;
}

.nav-link.active::after {
    content: '';
    position: absolute;
    width: 80%;
    height: 2px;
    bottom: -5px;
    left: 50%;
    background-color: #08cf72;
    transform: translateX(-50%);
}

/* Back to Top Button */
.back-to-top {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 50px;
    height: 50px;
    background-color: #08cf72;
    color: white;
    border: none;
    border-radius: 50%;
    font-size: 1.2rem;
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
    z-index: 1000;
    box-shadow: 0 4px 15px rgba(8, 207, 114, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
}

.back-to-top:hover {
    transform: translateY(-5px);
    box-shadow: 0 6px 20px rgba(8, 207, 114, 0.4);
}

.back-to-top.visible {
    opacity: 1;
    visibility: visible;
}

/* Mobile Menu Animation */
#mobileMenuDropdown {
    transition: all 0.3s ease;
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .section-title {
        font-size: 2rem;
    }
    
    .hero-content h1 {
        font-size: 2.5rem;
    }
    
    .hero-content p {
        font-size: 1rem;
    }
}

    </style>
    
</head>
<body class="flex flex-col min-h-screen">
