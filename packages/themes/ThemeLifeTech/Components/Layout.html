<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeTech</title>
    <link rel="icon" type="image/x-icon" href="<?= ltSiteHostAddress() ?>/storage/media/<?= ltSiteLogo() ?>">
    <meta name="description" content="Discover all the powerful features of LifeTech CMS. Everything you need to build and manage your website.">

    <script src="<?= ltPluginPath() ?>/PlgMyTailwind/Services/tailwind_4_cdn.js"></script> 
    <link rel="stylesheet" href="<?= ltPluginPath() ?>/PlgMyFontAwesome/Services/font-awesome.css" />

    <style type="text/tailwindcss">
        @theme {
            --color-primary: #08cf72;
            --color-primary-dark: #06b85f;
            --color-primary-light: #0ee685;
        }
    </style>
<style>
    /* ============================================
       LifeTech Cosmetic Styles
    ============================================ */

    /* Custom Button Styles */
    .btn-primary {
        background-color: #08cf72;
        color: white;
        transition: all 0.3s ease;
    }

    .btn-primary:hover {
        background-color: #06b85f;
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(8, 207, 114, 0.3);
    }

    .btn-outline-light {
        color: white;
        border: 2px solid rgba(255, 255, 255, 0.3);
        transition: all 0.3s ease;
    }

    .btn-outline-light:hover {
        background-color: rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 255, 255, 0.5);
    }

    .btn-outline-primary {
        border: 2px solid #08cf72;
        color: #08cf72;
        transition: all 0.3s ease;
    }

    .btn-outline-primary:hover {
        background-color: #08cf72;
        color: white;
        transform: translateY(-2px);
    }

    /* Section Title Underline */
    .section-title {
        position: relative;
        display: inline-block;
    }

    .section-title::after {
        content: '';
        position: absolute;
        width: 60px;
        height: 4px;
        background: #08cf72;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 2px;
    }

    /* Scroll Animations & Utilities */
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .fade-in {
        animation: fadeInUp 0.8s ease;
        opacity: 1 !important;
    }

    section {
        scroll-margin-top: 80px;
    }

    /* Nav & Interactions */
    .nav-link.active {
        color: #08cf72 !important;
    }

    .dropdown-menu.is-active {
        opacity: 1 !important;
        visibility: visible !important;
        transform: translateY(0) !important;
    }

    #mobileMenuDropdown {
        transition: all 0.3s ease;
    }
</style>
</head>
