    opacity: 1 !important;
    visibility: visible !important;
    transform: translateY(0) !important;
}
/* Hide scrollbar for horizontal scrolling containers */
.hide-scrollbar {
    -ms-overflow-style: none;  /* IE and Edge */
    scrollbar-width: none;  /* Firefox */
}
.hide-scrollbar::-webkit-scrollbar {
    display: none; /* Chrome, Safari and Opera */
}

</style>
<nav id="navbar" class="sticky top-0 left-0 right-0 z-50 bg-gray-900/95 backdrop-blur-sm shadow-lg">

        <div class="flex items-center justify-between min-h-[5rem] py-2">
            <a href="<?= ltSiteUrl() ?>" class="flex items-center text-2xl font-bold text-primary shrink-0">

            <button id="mobileMenuBtn" class="lg:hidden text-white p-2 focus:outline-none">

           <div class="hidden lg:block flex-1 min-w-0 px-6 border-r border-gray-700 mx-4">
                <div id="desktop-nav" class="flex items-center justify-start gap-x-6 flex-nowrap overflow-x-auto hide-scrollbar w-full py-1">

            </div>
                        <!-- 3. NEW Static Right: Action Buttons -->

                <a href="https://www.lifetech.host/hubs/docs" target="_blank" class="bg-[#08cf72] text-white py-2 px-4 rounded-md hover:bg-white hover:text-[#08cf72] font-medium transition-colors">

    <div id="mobileMenuDropdown" class="hidden lg:hidden bg-gray-900 border-t border-gray-800">

        </div>
    </div>

<?php ltImport('ThemeLifeTech', 'Script.js') ?>
<script>
(function() {
    'use strict';
    
    let navLinks = [];

    function initMobileMenu() {
        const btn = document.getElementById('mobileMenuBtn');
        const menu = document.getElementById('mobileMenuDropdown');
        if (!btn || !menu) return;

        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
            const icon = btn.querySelector('i');
            icon.classList.toggle('bi-list');
            icon.classList.toggle('bi-x');
        });
    }

    function renderNav() {
        const desktopContainer = document.getElementById('desktop-nav');
        const mobileContainer = document.getElementById('mobile-nav-container');
        const currentPath = window.location.pathname;

        if (desktopContainer) {
            desktopContainer.innerHTML = renderDesktopMenu(navLinks, currentPath);
        }
        if (mobileContainer) {
            let menuWithDocs = [...navLinks, { menuName: 'Documentation', routePath: `https://www.lifetech.host/hubs/Docs` }];
            mobileContainer.innerHTML = renderMobileMenu(menuWithDocs, currentPath);
        }
        
        // Re-init smooth scroll for newly injected anchors
        initSmoothScrolling();
        initDropdownClick();
    }
    function renderDesktopMenu(items, currentPage) {
        return items.map(item => {
            const hasChildren = item.children && item.children.length > 0;
            let url = item.isExternal ? item.routePath : (item.routePath.startsWith('#') ? item.routePath : `${siteHostAddress}${item.routePath}`);
            
            return `
                <div class="relative group shrink-0"> <!-- shrink-0 prevents items from squishing -->
                    <a href="${url}" class="nav-link text-white hover:text-primary transition-colors duration-200 font-medium" target="${item.target}">
                        ${item.menuName}
                    </a>
                    ${hasChildren ? `
                        <!-- Removed absolute, top-full, left-0, and group-hover classes. Added fixed and fixed-dropdown -->
                        <div class="dropdown-menu fixed-dropdown fixed bg-white shadow-xl min-w-48 py-2 opacity-0 invisible translate-y-2 transition-all duration-200 z-50 rounded-b-lg">
                            ${item.children.map(child => `
                                <a href="${siteHostAddress}${child.routePath}" class="block px-4 py-2 text-gray-800 hover:bg-gray-100 hover:text-primary text-sm" target="${item.target}">
                                    ${child.menuName}
                                </a>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>`;
        }).join('');
    }

    function renderMobileMenu(items, currentPage) {
    return items.map((item, index) => {
        const hasChildren = item.children && item.children.length > 0;
        const url = item.routePath.startsWith('#') ? item.routePath : `${siteHostAddress}${item.routePath}`;
        const menuId = `mobile-sub-${index}`;

        if (hasChildren) {
            return `
                <div class="space-y-2">
                    <button 
                        class="flex items-center justify-between w-full text-white hover:text-primary transition-colors font-medium"
                        id="toggleMobileSub"
                        data-menu-id="${menuId}"
                    >
                        <span>${item.menuName}</span>
                        <i class="bi bi-chevron-down transition-transform duration-200"></i>
                    </button>
                    <div id="${menuId}" class="hidden flex flex-col space-y-2 pl-4 border-l border-gray-700">
                        ${item.children.map(child => `
                            <a href="${siteHostAddress}${child.routePath}" class="text-gray-400 hover:text-primary text-sm transition-colors py-1">
                                ${child.menuName}
                            </a>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // Default single link if no children
        return `<a href="${item.menuName == 'Documentation' ?'https://www.lifetech.host/hubs/docs':url}"  target="${item.menuName == 'Documentation' ?'_blank':item.target}" class="${item.menuName == 'Documentation' ? 'bg-[#08cf72] py-2 px-3 rounded-md hover:bg-[white]' : ''}block text-white hover:text-primary transition-colors font-medium ">${item.menuName}</a>`;
    }).join('');
}

    async function onloadMenuContent() {
        try {
            const response = await fetch(`${BASE_URL}/menus/is-navigation`, {
                headers: { 'Accept': 'application/json' }
            });
            const { responseData } = await response.json();
            
            if (Array.isArray(responseData)) {
                // Combine default links with API links
                navLinks = [
                    { menuName: 'Home', routePath: `` },
                    ...responseData
                ];
                renderNav();
            }
        } catch (error) {
            console.error('Menu Load Error:', error);
        }
    }
    
    document.addEventListener('click', function(e){
        let btn = e.target.closest('#toggleMobileSub');
        if(!btn)return;
        let menuId = btn.dataset.menuId;
        toggleMobileSubmenu(menuId, btn);
    })
    
    function toggleMobileSubmenu(id, btn) {
        const menu = document.getElementById(id);
        const icon = btn.querySelector('i');
        
        if (menu) {
            const isHidden = menu.classList.contains('hidden');
            
            // Toggle menu visibility
            menu.classList.toggle('hidden');
            
            // Rotate the chevron icon
            if (isHidden) {
                icon.classList.add('rotate-180');
            } else {
                icon.classList.remove('rotate-180');
            }
        }
    }
    
    function initDropdownClick() {
        const dropdownParents = document.querySelectorAll('.group');
        const navContainer = document.getElementById('desktop-nav');
    
        // 1. Close menus if the user scrolls the nav horizontally to prevent detached floating menus
        if (navContainer) {
            navContainer.addEventListener('scroll', () => {
                document.querySelectorAll('.dropdown-menu').forEach(m => {
                    m.classList.remove('is-active', 'opacity-100', 'visible', 'translate-y-0');
                });
            }, { passive: true });
        }
    
        dropdownParents.forEach(parent => {
            const link = parent.querySelector('a');
            const menu = parent.querySelector('.dropdown-menu');
    
            if (menu) {
                link.addEventListener('click', function(e) {
                    if (!menu.classList.contains('is-active')) {
                        e.preventDefault();
                        
                        // Close other open menus
                        document.querySelectorAll('.dropdown-menu').forEach(m => {
                            if (m !== menu) m.classList.remove('is-active', 'opacity-100', 'visible', 'translate-y-0');
                        });
    
                        // Calculate the exact position of the parent link on the screen
                        const rect = parent.getBoundingClientRect();
                        
                        // Apply coordinates dynamically so it escapes the overflow: hidden trap
                        menu.style.top = `${rect.bottom + 12}px`; // 12px adds a nice gap
                        menu.style.left = `${rect.left}px`;
    
                        // Open this menu
                        menu.classList.add('is-active', 'opacity-100', 'visible', 'translate-y-0');
                    }
                });
            }
        });
    
        // 2. Close menu when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.group')) {
                document.querySelectorAll('.dropdown-menu').forEach(m => {
                    m.classList.remove('is-active', 'opacity-100', 'visible', 'translate-y-0');
                });
            }
        });
    }
    
    function initSmoothScrolling() {
        const anchors = document.querySelectorAll('a[href^="#"]');
        anchors.forEach(anchor => {
            anchor.onclick = function(e) {
                const targetId = this.getAttribute('href');
                if(targetId === '#') return;
                const targetElem = document.querySelector(targetId);
                if (targetElem) {
                    e.preventDefault();
                    const offset = document.getElementById('navbar').offsetHeight;
                    window.scrollTo({
                        top: targetElem.offsetTop - offset,
                        behavior: 'smooth'
                    });
                }
            };
        });
    }

    // Execution
    document.addEventListener('DOMContentLoaded', () => {
        initMobileMenu();
        onloadMenuContent();
    });
})();
</script>
