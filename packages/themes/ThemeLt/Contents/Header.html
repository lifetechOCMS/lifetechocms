const addThemeBtn = document.getElementById('rightSideBar');

// Open drawer
addThemeBtn.addEventListener('click', () => {
  addThemeDrawer.style.display = 'flex';
  requestAnimationFrame(() => {
    addThemeDrawer.classList.remove('translate-x-full');
  });
  renderRightSideBarMenu();
});

// Close drawer function (reusable)
function closeDrawer() {
  addThemeDrawer.classList.add('translate-x-full');
  setTimeout(() => {
    addThemeDrawer.style.display = 'none';
  }, 300);
}

// Close button
closeRightSidebarBtn.addEventListener('click', closeDrawer);

// Close on ESC key
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeDrawer();
  }
});

// Close on outside click
document.addEventListener('click', (e) => {
  if (
    addThemeDrawer.style.display === 'flex' &&
    !addThemeDrawer.contains(e.target) &&
    !addThemeBtn.contains(e.target)
  ) {
    closeDrawer();
  }
});



 
 function renderRightSideBarMenu() {
  rightSidebar.innerHTML = '';
  rightSidebar.appendChild(createSidebarMenuList(rightSideBarMenus));
  attachRightAccordionHandlers();
}

function createSidebarMenuList(items, level = 0) {
  const ul = document.createElement('ul');
  if (level > 0) ul.className = `ml-${level * 4} mt-1 overflow-hidden transition-all duration-300 max-h-0`;

  items.forEach((item, idx) => {
    const li = document.createElement('li');
    const hasSub = item.children && Array.isArray(item.children) && item.children.length > 0;

    if (hasSub) {
      li.innerHTML = `
        <button type="button"
                class="sidebar-item flex items-center w-full py-3 px-4 text-gray-700 rounded-lg mb-1 group focus:outline-none transition${collapseRightSideBar ? ' justify-center px-2' : ''}"
                data-rightAccordion="${item.ltId}" ${collapseRightSideBar ? 'disabled' : ''}>
          <i class="${item.icon || 'fa-duotone fa-solid fa-layer-group'} w-5"></i>
          ${collapseRightSideBar ? '' : `<span class="ml-3 flex-1 text-left sidebar-text font-medium">${item.menuName}</span>`}
          ${collapseRightSideBar ? '' : `<i class="fas fa-chevron-down ml-auto text-xs transition-transform duration-200" data-rightChevron="${item.ltId}"></i>`}
        </button>
      `;
      const subList = createSidebarMenuList(item.children, level + 1);
      subList.setAttribute('data-rightPanel', item.ltId);
      li.appendChild(subList);
    } else {
      li.innerHTML = `
        <a href="<?=ltSiteHostAddress()?>${item.routePath}"
           class="sidebar-item flex items-center py-3 px-4 text-gray-700 rounded-lg mb-1${collapseRightSideBar ? ' justify-center px-2' : ''}">
          <i class="${item.icon || 'fa-solid fa-box'} w-5 text-gray-500"></i>
          ${collapseRightSideBar ? '' : `<span class="ml-3 flex-1 text-left sidebar-text font-medium">${item.menuName}</span>`}
        </a>
      `;
    }

    ul.appendChild(li);
  });

  return ul;
}

function attachRightAccordionHandlers() {
  document.querySelectorAll('[data-rightAccordion]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (collapseRightSideBar) return;

      const id = btn.getAttribute('data-rightAccordion');
      const panel = document.querySelector(`[data-rightPanel="${id}"]`);
      const chev = document.querySelector(`[data-rightChevron="${id}"]`);
      if (!panel) return;

      const parentLi = btn.closest('li');
      const parentUl = parentLi?.parentElement;

      const open = panel.style.maxHeight && panel.style.maxHeight !== '0px';

      // Close sibling panels within the same parent <ul>
      parentUl?.querySelectorAll(':scope > li > [data-rightAccordion]').forEach(siblingBtn => {
        const siblingId = siblingBtn.getAttribute('data-rightAccordion');
        if (siblingId !== id) {
          const siblingPanel = document.querySelector(`[data-rightPanel="${siblingId}"]`);
          const siblingChev = document.querySelector(`[data-rightChevron="${siblingId}"]`);
          if (siblingPanel) {
            siblingPanel.style.maxHeight = '0px';
            // Recursively collapse nested children
            siblingPanel.querySelectorAll('[data-rightPanel]').forEach(nested => {
              nested.style.maxHeight = '0px';
              const nestedId = nested.getAttribute('data-rightPanel');
              const nestedChev = document.querySelector(`[data-rightChevron="${nestedId}"]`);
              if (nestedChev) nestedChev.classList.remove('rotate-180');
            });
          }
          if (siblingChev) siblingChev.classList.remove('rotate-180');
        }
      });

      // Toggle current panel
      if (open) {
          panel.style.maxHeight = '0px';
          chev?.classList.remove('rotate-180');
        } else {
          panel.style.maxHeight = panel.scrollHeight + 'px';
          chev?.classList.add('rotate-180');
          updateParentHeights(panel);
        }

    });
  });
}


function attachRightAccordionHandlers() {
  document.querySelectorAll('[data-rightAccordion]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (collapseRightSideBar) return;

      const id = btn.getAttribute('data-rightAccordion');
      const panel = document.querySelector(`[data-rightPanel="${id}"]`);
      const chev = document.querySelector(`[data-rightChevron="${id}"]`);
      if (!panel) return;

      const parentLi = btn.closest('li');
      const parentUl = parentLi?.parentElement;
      const isOpen = panel.style.maxHeight && panel.style.maxHeight !== '0px';

      // 🔒 Close sibling panels at same level
      parentUl?.querySelectorAll(':scope > li > [data-rightAccordion]').forEach(siblingBtn => {
        const siblingId = siblingBtn.getAttribute('data-rightAccordion');
        if (siblingId !== id) {
          const siblingPanel = document.querySelector(`[data-rightPanel="${siblingId}"]`);
          const siblingChev = document.querySelector(`[data-rightChevron="${siblingId}"]`);
          if (siblingPanel) {
            siblingPanel.style.maxHeight = '0px';
            // Collapse all nested panels
            siblingPanel.querySelectorAll('[data-rightPanel]').forEach(nested => {
              nested.style.maxHeight = '0px';
              const nestedId = nested.getAttribute('data-rightPanel');
              const nestedChev = document.querySelector(`[data-rightChevron="${nestedId}"]`);
              nestedChev?.classList.remove('rotate-180');
            });
          }
          siblingChev?.classList.remove('rotate-180');
        }
      });

      // 🔄 Toggle current panel
      if (isOpen) {
        panel.style.maxHeight = '0px';
        chev?.classList.remove('rotate-180');
        collapseDescendants(panel);
      } else {
        panel.style.maxHeight = panel.scrollHeight + 'px';
        chev?.classList.add('rotate-180');
        updateParentHeights(panel);
      }
    });
  });
}

// 🧹 Collapse nested submenus
function collapseDescendants(panel) {
  panel.querySelectorAll('[data-rightPanel]').forEach(sub => {
    sub.style.maxHeight = '0px';
  });
}

// 🪜 Recalculate only visible height for each ancestor
function updateParentHeights(panel) {
  let parent = panel.parentElement?.closest('[data-rightPanel]');
  while (parent) {
    let visibleHeight = 0;

    // Add heights of only visible children
    parent.querySelectorAll(':scope > li > [data-rightPanel]').forEach(childPanel => {
      const currentHeight = parseFloat(childPanel.style.maxHeight) || 0;
      visibleHeight += currentHeight > 0 ? childPanel.scrollHeight : 0;
    });

    parent.style.maxHeight = parent.scrollHeight + visibleHeight + 'px';
    parent = parent.parentElement?.closest('[data-rightPanel]');
  }
}

 function renderDesktopMenu(items, currentPage) {
  return items.map(item => {
    const isActive = currentPage === item.routePath;
    const hasChildren = Array.isArray(item.children) && item.children.length > 0;

    return `
      <div class="relative group">
        
        <a
          href="<?= ltSiteHostAddress() ?>${item.routePath}"
          class="flex items-center gap-1 text-sm font-bold uppercase tracking-wider py-2
            transition-colors duration-200
            ${isActive ? 'nav-link-active' : 'text-gray-600 hover:text-[#007c3a]'}"
        >
          <span>${item.menuName}</span>

          ${hasChildren ? `
            <i class="fas fa-chevron-down text-xs
               transition-transform duration-200
               group-hover:rotate-180"></i>
          ` : ''}
        </a>

        ${hasChildren ? `
          <div
            class="absolute left-0 top-full mt-1 hidden group-hover:block
                   bg-white shadow-lg min-w-48 z-50 rounded-md border border-gray-100"
          >
            ${item.children.map(child => `
              <a
                href="<?= ltSiteHostAddress() ?>${child.routePath}"
                class="block px-4 py-3 text-sm font-semibold whitespace-nowrap
                  transition-colors duration-150
                  ${currentPage === child.routePath
                    ? 'text-[#007c3a] bg-gray-50'
                    : 'text-gray-600 hover:bg-gray-100 hover:text-[#007c3a]'}"
              >
                ${child.menuName}
              </a>
            `).join('')}
          </div>
        ` : ''}

      </div>
    `;
  }).join('');
}
