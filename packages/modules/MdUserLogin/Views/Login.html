  <script>
  
    // State management
    const state = {
      form: {
        username: '',
        password: '',
        rememberMe: false
      },
      loading: false,
      showPassword: false
    };

    // DOM elements
    const elements = {
      loginForm: document.getElementById('loginForm'),
      username: document.getElementById('username'),
      password: document.getElementById('password'),
      rememberMe: document.getElementById('rememberMe'),
      togglePassword: document.getElementById('togglePassword'),
      submitBtn: document.getElementById('submitBtn'),
      snackbar: document.getElementById('snackbar')
    };
    

    // Initialize the application
    function init() {
      // Load remembered username if exists
      const rememberedUsername = localStorage.getItem('lifetechRememberedUsername');
      if (rememberedUsername) {
        state.form.username = rememberedUsername;
        state.form.rememberMe = true;
        elements.username.value = rememberedUsername;
        elements.rememberMe.checked = true;
      }

      // Add event listeners
      elements.loginForm.addEventListener('submit', handleSubmit);
      elements.username.addEventListener('input', handleInputChange);
      elements.password.addEventListener('input', handleInputChange);
      elements.rememberMe.addEventListener('change', handleCheckboxChange);
      elements.togglePassword.addEventListener('click', togglePasswordVisibility);
     // onLoadInfo();
    }

    // Event handlers
    function handleInputChange(e) {
      const { name, value } = e.target;
      state.form[name] = value;
    }

    function handleCheckboxChange(e) {
      const { name, checked } = e.target;
      state.form[name] = checked;
    }

    function togglePasswordVisibility() {
      state.showPassword = !state.showPassword;
      const passwordField = elements.password;
      const toggleIcon = elements.togglePassword.querySelector('i');
      
      if (state.showPassword) {
        passwordField.type = 'text';
        toggleIcon.classList.replace('fa-eye', 'fa-eye-slash');
        elements.togglePassword.setAttribute('aria-label', 'Hide password');
      } else {
        passwordField.type = 'password';
        toggleIcon.classList.replace('fa-eye-slash', 'fa-eye');
        elements.togglePassword.setAttribute('aria-label', 'Show password');
      }
    }

    function showSnackbar(message, color = 'green') {
      elements.snackbar.textContent = message;
      elements.snackbar.className = `fixed top-6 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-lg shadow-lg text-white text-sm font-medium transition-all duration-300 flex items-center ${color === 'green' ? 'bg-green-600' : 'bg-red-600'}`;
      
      const icon = document.createElement('i');
      icon.className = `fas ${color === 'green' ? 'fa-check-circle' : 'fa-exclamation-circle'} mr-2`;
      elements.snackbar.prepend(icon);
      
      elements.snackbar.classList.remove('hidden');
      
      // Auto-hide after appropriate time
      const hideTime = color === 'green' ? 2000 : 3000;
      setTimeout(() => {
        elements.snackbar.classList.add('fade-out');
        setTimeout(() => {
          elements.snackbar.classList.add('hidden');
          elements.snackbar.classList.remove('fade-out');
        }, 300);
      }, hideTime);
    }

    async function handleSubmit(e) {
      e.preventDefault();
      
      // Update state with current form values
      state.form.username = elements.username.value;
      state.form.password = elements.password.value;
      state.form.rememberMe = elements.rememberMe.checked;
      
      // Set loading state
      state.loading = true;
      elements.submitBtn.disabled = true;
      elements.submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Logging in...';
      let formData = {
          username:state.form.username,
          password:state.form.password
      }
      try {
          const options = {
            method: 'POST',
            headers: {
              'Accept': 'application/json'
            },
            body: JSON.stringify(formData)
          };
        
          const res = await fetch(`${BASE_URL}/users/login`, options);
          const data = await res.json();
          const { responseData, responseCategory, responseResult } = data;
        
          if (responseCategory === "200") {
            showSnackbar('Login Successfully', 'green');
        
            // Store token
            const getTokenName = "<?= ApiTokenDetails::tokenName(); ?>";
             localStorage.setItem(`${getTokenName}`, responseData[getTokenName]);
        
            // Remember username if checkbox is checked
            if (state.form.rememberMe) {
              localStorage.setItem('lifetechRememberedUsername', state.form.username);
            } else {
              localStorage.removeItem('lifetechRememberedUsername');
            }
            localStorage.removeItem('siteInfo');
            
            // // Optional: Redirect after login
            setTimeout(() => {
                //  window.history.back();
                window.location.href = `${siteHostAddress}//user-dashboard`;
            }, 1000);
          } else {
            showSnackbar(`Login failed: ${responseResult || 'Invalid credentials'}`, 'red');
          }
        } catch (err) {
          showSnackbar(`Login error: ${err.message || 'Something went wrong'}`, 'red');
        }

      
      // Reset loading state
      state.loading = false;
      elements.submitBtn.disabled = false;
      elements.submitBtn.innerHTML = 'Login';
      preloadImages();
    }

    // Initialize the app when DOM is loaded
    document.addEventListener('DOMContentLoaded', init);
  </script>
