
<?php ltImport('ThemeLifeTech', 'Script.js') ?>
  <script>
 
     function init() {
        
        async function logout(){
            const userDetails = <?= 
                class_exists('ApiTokenDetails') && method_exists('ApiTokenDetails', 'appId')
                    ? json_encode(ApiTokenDetails::appId().'_userDetails')
                    :  json_encode('userDetails');
            ?>;
            const siteInfo = <?= 
                class_exists('ApiTokenDetails') && method_exists('ApiTokenDetails', 'appId')
                    ? json_encode(ApiTokenDetails::appId().'_siteInfo')
                    :  json_encode('siteInfo');
            ?>;
            
            const getTokenNameNew = "<?= ApiTokenDetails::tokenName(); ?>";
              
            try{

                const responseRecord = await ajaxRequest(`/users/logout`,{token:LW_TOKEN}, "POST");
                 
                const { responseData, responseResult, responseCategory } = responseRecord;
                 
                 if(responseCategory === 200){
                     localStorage.removeItem(`${getTokenNameNew}`);
                     localStorage.removeItem(`${userDetails}`);
                     localStorage.removeItem(`${siteInfo}`);
                    Swal.fire('Bravo!!', `${responseResult}`, 'success').then(function(){
                        window.location.href = `${siteHostAddress}/admin`;
                    })
        
                 }else{
                     Swal.fire('Notice!!!', `${responseResult}`, 'warning')
                 }
                 
            }catch(error){
                 
                 console.log(error);
            }
             
        }
         // Un-commenting this will logout when preview 
        logout();    

    //   updateTable();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
