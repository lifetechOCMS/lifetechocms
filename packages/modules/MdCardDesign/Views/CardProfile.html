function updatePagination(total, totalPages) {
  elements.paginationNav.innerHTML = `
    <button class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 disabled:opacity-50" id="prevPageBtn" ${page === 1 ? 'disabled' : ''}>
      <i class="fas fa-chevron-left text-xs"></i>
    </button>
  `;

  const maxButtons = 5;
  let startPage, endPage;

  if (totalPages <= maxButtons) {
    startPage = 1;
    endPage = totalPages;
  } else if (page <= 3) {
    startPage = 1;
    endPage = 5;
  } else if (page >= totalPages - 2) {
    startPage = totalPages - 4;
    endPage = totalPages;
  } else {
    startPage = page - 2;
    endPage = page + 2;
  }

  for (let i = startPage; i <= endPage; i++) {
    const btn = document.createElement('button');
    btn.className = `relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium ${page === i ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'}`;
    btn.textContent = i;
    btn.disabled = page === i;
    btn.addEventListener('click', () => {
      page = i;
      updateTable();
    });
    elements.paginationNav.appendChild(btn);
  }

  const nextBtn = document.createElement('button');
  nextBtn.className = `relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 disabled:opacity-50`;
  nextBtn.id = 'nextPageBtn';
  nextBtn.innerHTML = '<i class="fas fa-chevron-right text-xs"></i>';
  nextBtn.disabled = page === totalPages;
  nextBtn.addEventListener('click', () => {
    if (page < totalPages) {
      page++;
      updateTable();
    }
  });
  elements.paginationNav.appendChild(nextBtn);

  document.getElementById('prevPageBtn').addEventListener('click', () => {
    if (page > 1) {
      page--;
      updateTable();
    }
  });
}

   function handleEdit(ltId) {
       
       
    const modalLabel = document.getElementById('modalLabel');
    document.getElementById('enableStatusDisplay').classList.add('hidden');
       
       
    // 1. Find the profile
    const profile = cardProfiles.find(p => p.ltId == ltId);
    if (!profile) return;
       // storing the ID somewhere for Updating
    editId = ltId;
    
     
    // update the title 
    modalLabel.innerHTML = `<i class="fas fa-edit mr-2"></i>Edit <span class="mx-1 text-amber-400"> ${profile?.title} </span> Profile`;

    const form = document.getElementById('responseForm');

    // ---------------------------------------------------------
    // A. Standard Fields (Text, Email, Select, Textarea)
    // ---------------------------------------------------------
    const fields = [
        'fullName', 'title', 'email1', 'email2', 'phone1', 'phone2',
        'company', 'location', 'bio', 'shortBio', 'isEnabled', 'assignTo',
        'facebook', 'twitter', 'instagram', 'linkedin', 'youtube','date',
        'whatsapp', 'github', 'tiktok', 'website', 'category', 'icon'
    ];

    fields.forEach(field => {
        const input = form.querySelector(`[name="${field}"]`);
        // Check if input exists and profile has data for it
        if (input && profile[field] !== undefined && profile[field] !== null) {
            input.value = profile[field];
        } else if (input) {
            input.value = ''; // Clear if data is null
        }
    });
    let html = populateSection(profile['sectionId']);
    elements.assignTo.innerHTML = html;
    
    elements.hiddenInput = profile.bio;
    quill.root.innerHTML = '';
    quill.root.innerHTML = domParser(profile.bio) || '';

    // ---------------------------------------------------------
    // B. Handle Extras (Dynamic JSON Fields)
    // ---------------------------------------------------------
    const fieldsContainer = document.getElementById('fieldsContainer');
    
    // 1. Parse Extra Data (Handle if it's string or object)
    let extras = profile.extra || {};
    if (typeof extras === 'string') {
        try { extras = JSON.parse(extras); } catch (e) { extras = {}; }
    }

    // 2. Clear ONLY the dynamic rows (keep the locked "Notes" row)
    // We assume the first row (index 0) is your locked "Notes" field
    const rowsToDelete = fieldsContainer.querySelectorAll('.field-row:not(:first-child)');
    rowsToDelete.forEach(row => row.remove());

    // 3. Reset the Locked "Notes" Field
   
    const notesInput = fieldsContainer.querySelector('.field-row:first-child');
    if (notesInput) {
        const notesValue = notesInput.closest('.field-row').querySelector('input[data-name="extra_value[]"]');
        const notesKey = notesInput.closest('.field-row').querySelector('input[data-name="extra_key[]"]');
        if (notesKey) {
            notesKey.value = Object.keys(extras)[0] || ''; // Set value or clear
            notesValue.value = Object.values(extras)[0] || ''; // Set value or clear
        }
    }

    // 4. Loop through extras and create rows for everything else
    Object.entries(extras).slice(1).forEach(([key, value]) => {

            addExtraFieldToForm(key, value); 
    });

    // D. Open the Drawer / Modal
    openProfileDrawer();
    
 
}

window.switchViewTab = function(targetId, btn) {
    // 1. Reset all tabs
    document.querySelectorAll('.view-tab-btn').forEach(t => {
        t.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
        t.classList.add('text-gray-500');
    });

    // 2. Hide all contents
    document.querySelectorAll('.view-content').forEach(c => c.classList.add('hidden'));

    // 3. Activate clicked button
    btn.classList.remove('text-gray-500');
    btn.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');

    // 4. Show target content
    document.getElementById(targetId).classList.remove('hidden');
};

         function updateUI() {
          // Tabs style
          tab.tabAll.forEach((t, index) => {
            t.classList.remove(
              "bg-blue-300",
              "border-b-3",
              "hover:bg-blue-400",
              "border-blue-700",
            );
            t.classList.add("bg-gray-300", "hover:bg-gray-400");

            tab.contents[index].classList.add("hidden");

            if (index === tab.currentTab) {
              t.classList.remove("bg-gray-300", "hover:bg-gray-400");
              t.classList.add(
                "bg-blue-300",
                "border-b-3",
                "hover:bg-blue-400",
                "border-blue-700",
              );
              tab.contents[index].classList.remove("hidden");
            }
          });

          // Buttons logic
          tab.btnPrev.classList.toggle("hidden", tab.currentTab === 0);
          tab.btnNext.classList.toggle(
            "hidden",
            tab.currentTab === tab.contents.length - 1,
          );

        }
      
      // Tab click
        tab.tabAll.forEach((t) => {
          t.addEventListener("click", (e) => {
              e.preventDefault();
            tab.currentTab = Number(t.dataset.tab);
            updateUI();
          });
        });

        // Next
        tab.btnNext.addEventListener("click", () => {
          if (tab.currentTab < tab.contents.length - 1) {
            tab.currentTab++;
            updateUI();
          }

        if(!btn) return;
        let ltId = btn.dataset.id;
        let btnLoader = btn.previousElementSibling;
        let title = btn.dataset.title;
        // console.log(btnLoader);
        
        // calling the function
        viewSection(ltId, title, btnLoader);
    });
    
    document.addEventListener('click', function(e){
        let btn = e.target.closest('#viewAvailableSection');
        if(!btn) return;
        let ltId = btn.dataset.id;
        let title = btn.textContent;
        let btnLoader = btn.nextElementSibling;
        // calling the function
        viewSection(ltId, title, btnLoader);

    })
    
   async function viewSection(ltId, title, btnLoader){
        document.getElementById('modalTitle').textContent = `Available Section for: ${title}`;
        btnLoader.innerHTML = '<div class="w-5 h-5 rounded-full border-b-2 border-blue-500 animate-spin"></div>';
        try{
            
            const [data] = await Promise.all([
                    ajaxRequest(`/cards/sections/profiles?profileId=${ltId}`)
                ]);
                
            const {responseData, responseResult, responseCategory} = data;
            
            if(responseCategory == '200'){
                
                if (Array.isArray(responseData) && responseData.length > 0) {
                            state.section = [...responseData];
                    }else{
                        state.section = [];
                    }
                state.profileId = ltId;
                
                let html = populateSection();
                sectionAssignSelect.innerHTML = html;
                displayViewSectionTable();
                openTableDrawer();
                
            }else{
                Swal.fire('Oops!!', `${responseResult}`, 'warning');
            }
            
            
        }catch(error){
            console.log(error)
        }finally{
            btnLoader.innerHTML = '';
        }
    }
     
    function displayViewSectionTable(){
        const sectionModalBody = document.getElementById('sectionTableData');
        const filtered = getFilteredPages();
        const paginated = getPaginatedPages();
        const totalPages = getTotalPages();
        const total = filtered.length;
        sectionModalBody.innerHTML =`
            <div class="bg-white rounded-xl shadow-md overflow-y-auto flex-1 p-6 bg-gray-50 border-gray-200">
                <div class="p-4 border-b border-gray-200 flex flex-row items-center justify-between">
                  <div class="flex items-center">
                    <label class="text-sm text-gray-600 mr-2">Show</label>
                    <select
                      class="bg-gray-100 border border-gray-300 text-gray-700 py-1 px-3 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                      value="${state.entriesPerPage}"
                      onchange="handleEntriesChange(this.value)"
                    >
                      ${[10, 25, 50, 100].map(n => `<option value="${n}" ${state.entriesPerPage === n ? 'selected' : ''}>${n}</option>`).join('')}
                    </select>
                      <button class="flex items-center justify-center w-10 h-10 rounded-md hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 ml-4" onclick="handleTogglePublishFilter()">
                        <i class="fas fa-filter text-gray-600"></i>
                      </button>
                  </div>
                  <div>
                    <span class="font-bold text-2xl text-gray-500">${paginated[0].fullName}</span>
                  </div>
                  <div class="flex justify-end">
                    <nav class="inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
                      <button
                        class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
                        onclick="handlePageChange(${Math.max(1, state.page - 1)})"
                        ${state.page === 1 ? 'disabled' : ''}
                      >
                        <span class="sr-only">Previous</span>
                        <i class="fas fa-chevron-left text-xs"></i>
                      </button>
                      ${Array.from({ length: Math.min(totalPages, 5) }, (_, idx) => {
                        let pageNum;
                        if (totalPages <= 5) {
                          pageNum = idx + 1;
                        } else if (state.page <= 3) {
                          pageNum = idx + 1;
                        } else if (state.page >= totalPages - 2) {
                          pageNum = totalPages - 4 + idx;
                        } else {
                          pageNum = state.page - 2 + idx;
                        }
                        return `
                        <button
                          class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium focus:outline-none ${state.page === pageNum ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'}"
                          onclick="handlePageChange(${pageNum})"
                          ${state.page === pageNum ? 'disabled' : ''}
                        >
                          ${pageNum}
                        </button>
                      `}).join('')}
                      <button
                        class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
                        onclick="handlePageChange(${Math.min(totalPages, state.page + 1)})"
                        ${state.page === totalPages ? 'disabled' : ''}
                      >
                        <span class="sr-only">Next</span>
                        <i class="fas fa-chevron-right text-xs"></i>
                      </button>
                    </nav>
                  </div>
                </div>
                <div class="theme-table-container overflow-x-auto">
                  <table class="theme-table w-full min-w-[1000px] text-sm">
                    <thead>
                      <tr class="bg-gray-50 text-left">
                        <th class="py-3 px-2 border-b border-gray-200 text-center">SN</th>
                        <th class="py-3 px-2 font-medium text-gray-600 border-b border-gray-200">Card Section</th>
                        <th class="py-3 px-2 font-medium text-gray-600 border-b border-gray-200">Action</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${paginated.length === 0 ? `
                        <tr>
                          <td colspan="11" class="text-center py-6 text-gray-400">No section found.</td>
                        </tr>
                      ` : paginated.map((p, i) => `
                        <tr class="hover:bg-blue-50 transition duration-150 cursor-pointer">
                            <td class="py-3 px-4 border-b border-gray-200 text-center">${(state.page - 1) * state.entriesPerPage + i + 1}</td>
                            <td class="py-3 px-4 border-b border-gray-200 font-medium">
                              <span class="px-1 py-0.2 text-[15px]">${p.sectionName ?? ''}</span>
                            </td>
                            <td class="py-3 px-4 border-b border-gray-200">
                                <div class="flex items-center gap-1">
                                    <button id="deleteSection" aria-label="Delete" class="text-gray-500 hover:text-red-600 mx-1 focus:outline-none" data-id="${p.ltId}">
                                      <i class="fas fa-trash-alt text-lg text-red-400"></i>
                                    </button>
                                    <span id="deleteLoader"></span>
                                </div>  
                            </td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
                <div class="text-sm text-gray-500 p-2">
                  Showing ${total === 0 ? 0 : (state.page - 1) * state.entriesPerPage + 1} to ${Math.min(state.page * state.entriesPerPage, total)} of ${total} entries
                </div>
            </div>
          `;
        
        }

    
    function openTableDrawer(){
        document.getElementById('sectionModal').classList.remove('hidden');
        displayViewSectionTable();
    }
    
    function closeTableDrawer(){
        // resetFilter();
        state.entriesPerPage = 10;
        state.editId = null;
        document.getElementById('sectionModal').classList.add('hidden');
        // state.showFilterOptions = !state.showFilterOptions;
        // state.showFilters = !state.showFilters; 
        // document.getElementById('filterBarPublish').classList.add('hidden');
    }
    
    function handleEntriesChange(value) {
      state.entriesPerPage = parseInt(value);
      state.page = 1;
      displayViewSectionTable();
    }

    function handlePageChange(newPage) {
      state.page = newPage;
      displayViewSectionTable();
    }
     
     
     
    /**
     * View Section
     */

    
  </script>
  </body>
